spring.application.name=employee-management

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

#Employee Management Configuration
employee.management.app-name=Employee Management System
employee.management.version=1.0
employee.management.max-records=100
employee.management.enable-audit=true

#Invalid data for Employee Management Configuration to check validation
#employee.management.app-name=
#employee.management.version=1.0
#employee.management.max-records=-10
#employee.management.enable-audit=true

#logging configuration
logging.level.root=INFO
logging.level.com.example.employeemanagement=TRACE