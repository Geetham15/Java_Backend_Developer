spring.application.name=employee-management

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

spring.profiles.active=dev

#logging to the file and log rotation
logging.file.name=logs/employee-management.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
#Spring Boot Actuators
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

#Actuator info endpoints
management.info.env.enabled=true

info.app.name=Employee Management System
info.app.description=Spring Boot Employee Management REST API
info.app.version=1.0